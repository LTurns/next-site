<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
  <title>CAD Innovation Wireframe Background</title>
  <defs>
    <!-- gradient stroke for some variation -->
    <linearGradient id="fadeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <!-- vertical lines -->
    <path d="M 0 0 L 0 600 M 80 0 L 80 600 M 160 0 L 160 600 M 240 0 L 240 600
             M 320 0 L 320 600 M 400 0 L 400 600 M 480 0 L 480 600
             M 560 0 L 560 600 M 640 0 L 640 600 M 720 0 L 720 600
             M 800 0 L 800 600 M 880 0 L 880 600 M 960 0 L 960 600
             M 1040 0 L 1040 600 M 1120 0 L 1120 600 M 1200 0 L 1200 600
             M 1280 0 L 1280 600 M 1360 0 L 1360 600 M 1440 0 L 1440 600
             M 1520 0 L 1520 600 M 1600 0 L 1600 600 M 1680 0 L 1680 600
             M 1760 0 L 1760 600 M 1840 0 L 1840 600 M 1920 0 L 1920 600"/>
    <!-- horizontal lines -->
    <path d="M 0 0 L 1920 0 M 0 80 L 1920 80 M 0 160 L 1920 160 M 0 240 L 1920 240
             M 0 320 L 1920 320 M 0 400 L 1920 400 M 0 480 L 1920 480 M 0 560 L 1920 560 M 0 600 L 1920 600"/>
  </g>

  <!-- Curved schematic arcs -->
  <g stroke="url(#fadeLine)" stroke-width="2" fill="none">
    <path d="M -200 500 Q 600 200 1400 500 T 2200 500"/>
    <path d="M -200 400 Q 800 100 1800 400 T 2600 400"/>
    <path d="M -200 300 Q 500 50 1200 300 T 2000 300"/>
  </g>

  <!-- Technical circles / nodes -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none">
    <circle cx="400" cy="200" r="80"/>
    <circle cx="1200" cy="420" r="60"/>
    <circle cx="1600" cy="180" r="100"/>
  </g>

  <!-- Connector lines -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 4">
    <line x1="400" y1="200" x2="1200" y2="420"/>
    <line x1="1200" y1="420" x2="1600" y2="180"/>
    <line x1="400" y1="200" x2="1600" y2="180"/>
  </g>
</svg>
